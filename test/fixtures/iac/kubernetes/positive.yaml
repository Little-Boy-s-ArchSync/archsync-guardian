apiVersion: v1
kind: ConfigMap
metadata:
  name: orders-config
  namespace: orders
  labels:
    app.kubernetes.io/name: orders-api
data:
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: orders
  labels:
    app: orders-api
  annotations:
    archsync.io/approved: "true"
    archsync.io/trust-boundary: application
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: api
          image: example.invalid/orders:v1
          envFrom:
            - configMapRef:
                name: orders-config
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: orders-config
                  key: LOG_LEVEL
      volumes:
        - name: config
          configMap:
            name: orders-config
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: orders
  annotations:
    archsync.io/approved: "true"
    archsync.io/trust-boundary: application
spec:
  type: ClusterIP
  selector:
    app: orders-api
  ports:
    - port: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orders-public
  namespace: orders
  annotations:
    archsync.io/trust-boundary: public
spec:
  defaultBackend:
    service:
      name: orders-api
      port:
        number: 80
  rules:
    - host: orders.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orders-api
                port:
                  number: 80
