apiVersion: apps/v1
kind: Deployment
metadata:
  name: templated-worker
  namespace: orders
spec:
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image }}"
          envFrom:
            - configMapRef:
                name: missing-config
---
apiVersion: v1
kind: Service
metadata:
  name: missing-selector
  namespace: orders
spec:
  selector:
    app: absent
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: missing-route
  namespace: orders
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: absent-service
                port:
                  number: 80
---
apiVersion: v1
kind: Secret
metadata:
  name: unsupported
  namespace: orders
