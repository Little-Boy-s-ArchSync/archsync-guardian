name: Phase 3 verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm phase3:verify
      - name: Ensure committed build and evidence are current
        run: git diff --exit-code -- dist evidence
      - name: Upload Guardian evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: guardian-evidence-${{ matrix.os }}
          if-no-files-found: error
          path: |
            evidence/phase-2-evidence.json
            evidence/phase-3-evidence.json
            .artifacts/package-install.json
            coverage/coverage-summary.json
            coverage/index.html
